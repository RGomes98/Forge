name: Forge CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Least privilege by default. Only the benchmark job needs write access.
permissions:
  contents: read

# A new push to the same pull request cancels the run in progress. Runs on `main` are never cancelled,
# so every merged commit gets a complete result (and a benchmark data point).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with `rust-version` in `[workspace.package]` (Cargo.toml).
  MSRV: "1.88"

jobs:
  check-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust
        run: rustup toolchain install

      - name: Run rustfmt
        run: cargo fmt --all -- --check

  test-suite:
    runs-on: ubuntu-latest
    needs: check-format
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust
        run: rustup toolchain install

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Tests
        run: cargo test --workspace --locked

  msrv:
    runs-on: ubuntu-latest
    needs: check-format
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust ${{ env.MSRV }}
        run: rustup toolchain install "$MSRV" --profile minimal

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      # `+$MSRV` overrides the `stable` channel pinned by rust-toolchain.toml.
      - name: Check on MSRV
        run: cargo +"$MSRV" check --workspace --all-targets --locked

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Fails on known vulnerabilities, unsound or unmaintained crates and yanked versions in Cargo.lock.
      # Accepted exceptions live in deny.toml, each with a reason.
      - name: Audit Dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  benchmark:
    runs-on: ubuntu-latest
    # Runs only when formatting, lints and tests passed (test-suite itself needs check-format).
    needs: test-suite
    timeout-minutes: 20

    permissions:
      contents: write # push results to the `benchmark-history` branch
      deployments: write
      pull-requests: write # benchmark comment on pull requests

    steps:
      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk

      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust
        run: rustup toolchain install

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Server
        run: cargo build --release --locked

      - name: Start Server
        run: |
          ulimit -n 65535
          nohup ./target/release/forge-example &
          echo $! > server_pid.txt

      - name: Run Benchmark
        run: |
          ulimit -n 65535

          URL="http://127.0.0.1:3000/ping"
          OUTPUT=$(wrk -t12 -c1000 -d10s $URL)

          echo "--- WRK Output ---"
          echo "$OUTPUT"
          echo "-----------------------"

          RPS=$(echo "$OUTPUT" | grep "Requests/sec" | awk '{print $2}')

          printf '[
            {
              "name": "API Throughput",
              "unit": "req/s",
              "value": %s
            }
          ]' "$RPS" > benchmark_result.json

      - name: Stop Server
        run: kill "$(cat server_pid.txt)"

      - name: Store and Compare Performance
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'customBiggerIsBetter'
          gh-pages-branch: 'benchmark-history'
          output-file-path: benchmark_result.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}

          save-data-file: true
          comment-always: true
          summary-always: true
          comment-on-alert: true

          fail-on-alert: true
          alert-threshold: '105%'
